apiVersion: apps/v1
kind: Deployment
metadata:
  name: d3
  namespace: drills
spec:
  replicas: 2
  selector:
    matchLabels:
      app: d3
  template:
    metadata:
      labels:
        app: d3
    spec:
      containers:
        - name: app
          image: launchpad-api:dev
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          resources:
            requests: { cpu: "50", memory: 64Mi }
            limits: { memory: 128Mi }
