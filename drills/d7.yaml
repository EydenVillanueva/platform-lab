apiVersion: apps/v1
kind: Deployment
metadata:
  name: d7
  namespace: drills
spec:
  replicas: 1
  selector:
    matchLabels:
      app: d7
  template:
    metadata:
      labels:
        app: d7
    spec:
      containers:
        - name: app
          image: launchpad-api:dev
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          env:
            - name: STARTUP_DELAY_MS
              value: "30000"
          livenessProbe:
            httpGet: { path: /readyz, port: 8080 }
            periodSeconds: 3
            failureThreshold: 2
          readinessProbe:
            httpGet: { path: /readyz, port: 8080 }
            periodSeconds: 5
          resources:
            requests: { cpu: 50m, memory: 64Mi }
            limits: { memory: 128Mi }
