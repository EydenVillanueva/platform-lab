apiVersion: apps/v1
kind: Deployment
metadata:
  name: d5
  namespace: drills
spec:
  replicas: 2
  selector:
    matchLabels:
      app: d5
  template:
    metadata:
      labels:
        app: d5
    spec:
      containers:
        - name: app
          image: launchpad-api:dev
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          readinessProbe:
            httpGet: { path: /ready, port: 8080 }
            periodSeconds: 5
          resources:
            requests: { cpu: 50m, memory: 64Mi }
            limits: { memory: 128Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: d5
  namespace: drills
spec:
  selector:
    app: d5
  ports:
    - port: 80
      targetPort: 8080
