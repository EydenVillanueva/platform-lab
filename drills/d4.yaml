apiVersion: apps/v1
kind: Deployment
metadata:
  name: d4
  namespace: drills
spec:
  replicas: 2
  selector:
    matchLabels:
      app: d4
  template:
    metadata:
      labels:
        app: d4
    spec:
      containers:
        - name: app
          image: launchpad-api:dev
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          resources:
            requests: { cpu: 50m, memory: 64Mi }
            limits: { memory: 128Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: d4
  namespace: drills
spec:
  selector:
    app: d4-api
  ports:
    - port: 80
      targetPort: 8080
