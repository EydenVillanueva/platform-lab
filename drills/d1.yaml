apiVersion: apps/v1
kind: Deployment
metadata:
  name: d1
  namespace: drills
spec:
  replicas: 2
  selector:
    matchLabels:
      app: d1
  template:
    metadata:
      labels:
        app: d1
    spec:
      containers:
        - name: app
          image: launchpad-api:v9
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          resources:
            requests: { cpu: 50m, memory: 64Mi }
            limits: { memory: 128Mi }
